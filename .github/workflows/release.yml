name: Release Manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.0)"
        required: true
        type: string
      create_tag:
        description: "Create tag vX.Y.Z if it does not exist"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  roms:
    name: Build ROMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          make -C roms
      - uses: actions/upload-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-roms
          path: roms/*.wasm

  build:
    needs: roms
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: linux-x64
          - name: Linux x86 32-bit
            os: ubuntu-latest
            target: linux-x86
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: linux-arm64
          - name: macOS Intel x64
            os: macos-15-intel
            target: macos-x64
          - name: macOS ARM64
            os: macos-14
            target: macos-arm64
          - name: Windows x64 (MinGW)
            os: windows-latest
            target: windows-mingw
          - name: Windows x86 (MinGW)
            os: windows-latest
            target: windows-mingw32
          - name: Windows x64 (MSVC)
            os: windows-latest
            target: windows-msvc
          - name: Windows x86 (MSVC)
            os: windows-latest
            target: windows-msvc32

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-roms
          path: roms/

      - name: Deps (Linux x64 / ARM64)
        if: matrix.target == 'linux-x64' || matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev pkg-config
      - name: Build (Linux x86 via Docker)
        if: matrix.target == 'linux-x86'
        run: >
          docker run --rm -v "$PWD:/src" -w /src i386/debian:12 bash -c "
            apt-get update -qq &&
            apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev pkg-config make git &&
            make -C emulators/wasm3 &&
            make -C emulators/gifnostic
          "
      - name: Deps (macOS)
        if: startsWith(matrix.target, 'macos')
        run: brew install sdl2 make pkg-config
      - name: Deps (Windows MinGW x64)
        if: matrix.target == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 make git
      - name: Deps (Windows MinGW x86)
        if: matrix.target == 'windows-mingw32'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-SDL2 make git

      - name: Build (Linux / macOS)
        if: startsWith(matrix.target, 'linux') && matrix.target != 'linux-x86' || startsWith(matrix.target, 'macos')
        run: |
          make -C emulators/wasm3
          make -C emulators/gifnostic
      - name: Build (Windows MinGW)
        if: startsWith(matrix.target, 'windows-mingw')
        shell: msys2 {0}
        run: |
          make -C emulators/wasm3
          make -C emulators/gifnostic
      - name: Build (Windows MSVC)
        if: startsWith(matrix.target, 'windows-msvc')
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/wasm3/wasm3.git emulators/wasm3/wasm3
          vcpkg install sdl2:${{ matrix.target == 'windows-msvc' && 'x64' || 'x86' }}-windows glew:${{ matrix.target == 'windows-msvc' && 'x64' || 'x86' }}-windows
          cmake -S . -B build -A ${{ matrix.target == 'windows-msvc' && 'x64' || 'Win32' }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.target == 'windows-msvc' && 'x64' || 'x86' }}-windows
          cmake --build build --config Release

      - name: Rename binaries
        shell: bash
        run: |
          EXT=""; SRC="emulators/wasm3/wagnostic"; GIF_SRC="emulators/gifnostic/gifnostic"
          case "${{ matrix.target }}" in
            windows-msvc)   SRC="build/Release/wagnostic.exe"; GIF_SRC="build/Release/gifnostic.exe"; EXT=".exe" ;;
            windows-msvc32) SRC="build/Release/wagnostic.exe"; GIF_SRC="build/Release/gifnostic.exe"; EXT=".exe" ;;
            windows-*)      EXT=".exe" ;;
          esac
          DST="wagnostic-${{ inputs.version }}-${{ matrix.target }}${EXT}"
          GIF_DST="gifnostic-${{ inputs.version }}-${{ matrix.target }}${EXT}"
          if [ -f "$SRC" ]; then mv "$SRC" "$DST"; fi
          if [ -f "${GIF_SRC}${EXT}" ]; then mv "${GIF_SRC}${EXT}" "$GIF_DST"
          elif [ -f "$GIF_SRC" ]; then mv "$GIF_SRC" "$GIF_DST"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-${{ matrix.target }}
          path: |
            wagnostic-${{ inputs.version }}-${{ matrix.target }}*
            gifnostic-${{ inputs.version }}-${{ matrix.target }}*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag if requested
        if: inputs.create_tag
        run: |
          tag="${{ inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then echo "Tag $tag exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p bin roms
          # Move ROMs (.wasm) to roms/
          cp artifacts/wagnostic-${VERSION}-roms/*.wasm roms/
          # Move binaries to bin/ (skip the roms artifact folder)
          for dir in artifacts/wagnostic-${VERSION}-*/; do
            if [ "$dir" != "artifacts/wagnostic-${VERSION}-roms/" ]; then
              cp "$dir"/* bin/
            fi
          done
          # Create single zip with bin/ and roms/
          zip -r "wagnostic-${VERSION}.zip" bin/ roms/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: "Wagnostic ${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          files: wagnostic-*.zip
