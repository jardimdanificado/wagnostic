name: Release Manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.0)"
        required: true
        type: string
      create_tag:
        description: "Create tag vX.Y.Z if it does not exist"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  roms:
    name: Build ROMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          make -C examples roms
      - uses: actions/upload-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-roms
          path: examples/*.wasm

  build:
    needs: roms
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: linux-x64
          - name: Linux x86 32-bit
            os: ubuntu-latest
            target: linux-x86
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: linux-arm64
          - name: macOS Intel x64
            os: macos-15-intel
            target: macos-x64
          - name: macOS ARM64
            os: macos-14
            target: macos-arm64
          - name: Windows x64 (MinGW)
            os: windows-latest
            target: windows-mingw
          - name: Windows x86 (MinGW)
            os: windows-latest
            target: windows-mingw32
          - name: Windows x64 (MSVC)
            os: windows-latest
            target: windows-msvc
          - name: Windows x86 (MSVC)
            os: windows-latest
            target: windows-msvc32

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-roms
          path: examples/

      - name: Deps (Linux x64 / ARM64)
        if: matrix.target == 'linux-x64' || matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev pkg-config
      - name: Build (Linux x86 via Docker)
        if: matrix.target == 'linux-x86'
        run: >
          docker run --rm -v "$PWD:/src" -w /src i386/debian:12 bash -c "
            apt-get update -qq &&
            apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev pkg-config make git &&
            make -C runners/wasm3
          "
      - name: Deps (macOS)
        if: startsWith(matrix.target, 'macos')
        run: brew install sdl2 make pkg-config
      - name: Deps (Windows MinGW x64)
        if: matrix.target == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 make git
      - name: Deps (Windows MinGW x86)
        if: matrix.target == 'windows-mingw32'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-SDL2 make git

      - name: Build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux-x86) ;; # done via docker above
            linux-*)   make -C runners/wasm3 ;;
            macos-*)   make -C runners/wasm3 ;;
            windows-mingw*) make -C runners/wasm3 ;;
            windows-msvc*)
              TRIPLET=${{ matrix.target == 'windows-msvc' && 'x64' || 'x86' }}
              git clone --depth 1 https://github.com/wasm3/wasm3.git runners/wasm3/wasm3
              vcpkg install sdl2:${TRIPLET}-windows glew:${TRIPLET}-windows
              cmake -S . -B build -A ${{ matrix.target == 'windows-msvc' && 'x64' || 'Win32' }} \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=${TRIPLET}-windows
              cmake --build build --config Release
              ;;
          esac

      - name: Rename binary
        shell: bash
        run: |
          EXT=""; SRC="wagnostic"
          case "${{ matrix.target }}" in
            windows-msvc)   SRC="build/Release/wagnostic.exe"; EXT=".exe" ;;
            windows-msvc32) SRC="build/Release/wagnostic.exe"; EXT=".exe" ;;
            windows-*)      EXT=".exe" ;;
          esac
          DST="wagnostic-${{ inputs.version }}-${{ matrix.target }}${EXT}"
          if [ -f "$SRC" ]; then mv "$SRC" "$DST"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wagnostic-${{ inputs.version }}-${{ matrix.target }}
          path: wagnostic-${{ inputs.version }}-${{ matrix.target }}*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag if requested
        if: inputs.create_tag
        run: |
          tag="${{ inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then echo "Tag $tag exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: "Wagnostic ${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/**/*
