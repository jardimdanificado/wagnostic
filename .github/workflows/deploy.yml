name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang xxd ffmpeg

      - name: Prepare Deployment Directory
        run: |
          mkdir dist
          # Clone xcc and build cc.wasm
          git clone https://github.com/tyfkda/xcc.git /tmp/xcc
          cd /tmp/xcc
          make wcc cc.wasm
          cd $GITHUB_WORKSPACE
          
          # Generate sysroot.json
          python3 -c "import os, json, base64
          def build_tree(path):
              tree = {}
              if not os.path.exists(path): return tree
              for entry in os.scandir(path):
                  if entry.is_dir(follow_symlinks=False):
                      subtree = build_tree(entry.path)
                      if subtree: tree[entry.name] = subtree
                  elif entry.is_file(follow_symlinks=False):
                      if entry.name.endswith('.h') or entry.name.endswith('.c'):
                          with open(entry.path, 'rb') as f:
                              tree[entry.name] = base64.b64encode(f.read()).decode('utf-8')
              return tree
          sysroot = {
              'wagner': build_tree('wagner'),
              'include': build_tree('/tmp/xcc/include')
          }
          with open('runners/web/sysroot.json', 'w') as f:
              json.dump(sysroot, f)"
          
          cp /tmp/xcc/cc.wasm runners/web/
          cp -r runners/web/* dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
