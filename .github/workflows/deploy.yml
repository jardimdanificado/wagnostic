name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm xxd ffmpeg

      - name: Prepare Deployment Directory
        run: |
          mkdir dist
          # Clone xcc and build cc.wasm
          git clone https://github.com/tyfkda/xcc.git /tmp/xcc
          cd /tmp/xcc
          make wcc
          rm -rf obj
          make cc.wasm CC=./wcc
          cd $GITHUB_WORKSPACE
          
          # Generate sysroot.json
          python3 -c "import os, json, base64
          def build_flat(path, prefix):
              flat = {}
              if not os.path.exists(path): return flat
              for root, dirs, files in os.walk(path):
                  for f in files:
                      if f.endswith('.h') or f.endswith('.c'):
                          full = os.path.join(root, f)
                          rel = os.path.relpath(full, path)
                          flat[f'sysroot/{prefix}/{rel}'] = base64.b64encode(open(full, 'rb').read()).decode('utf-8')
              return flat
          sysroot = build_flat('/tmp/xcc/include', 'include')
          with open('emulators/web/sysroot.json', 'w') as f:
              json.dump(sysroot, f)"
          
          cp /tmp/xcc/cc.wasm emulators/web/
          cp -r emulators/web/* dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
