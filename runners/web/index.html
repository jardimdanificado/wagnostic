<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wagnostic Web Runner</title>
</head>
<body>
    <h1>Wagnostic</h1>
    
    <p>
        <label for="wasmInput">Load ROM:</label>
        <input type="file" id="wasmInput" accept=".wasm">
    </p>
    
    <div id="canvasWrapper">
        <p id="emptyState">No game loaded. Select a .wasm file above.</p>
        <canvas id="gameCanvas" width="320" height="240"></canvas>
    </div>
    
    <fieldset>
        <legend>Virtual Gamepad</legend>
        <button data-btn="up">Up</button>
        <button data-btn="down">Down</button>
        <button data-btn="left">Left</button>
        <button data-btn="right">Right</button>
        <button data-btn="a">A</button>
        <button data-btn="b">B</button>
        <button data-btn="select">Select</button>
        <button data-btn="start">Start</button>
    </fieldset>
    
    <p><strong>Keyboard Controls:</strong> Arrows = D-Pad | Z / X = A / B | Enter = Start | Shift = Select</p>
    
    <script src="fflate.js"></script>
    <script src="runner.js"></script>
</body>
</html>
